[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-federated-behaviour-ai"
version = "0.1.0"
description = "Quantum-Centric Federated Learning for Screen-Time-Associated Behavioural Risk Assessment"
requires-python = ">=3.12"
authors = [{name = "Research Team"}]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_level = "INFO"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]
